# CI publique — la preuve que le calcul se rejoue, sans nous croire sur parole.
# Gate (nommée AVANT le code, règle §6 du studio) : ce workflow est FEU VERT si
#   1. chaque pièce listée dans EMPREINTES.json (données, scripts, résultats, protocole, outils)
#      a l'empreinte publiée ;
#   2. ruff passe sur les outils du dépôt (rejouer.py, verifier_empreintes.py) ;
#   3. les trois scripts de calcul, relancés sur les données publiées ici, redonnent les cinq
#      fichiers de resultats/ (fins de ligne mises à part ; pour un JSON, l'ordre des ex æquo
#      d'un dictionnaire aussi, dit à l'écran quand il joue : rejouer.py).
# Les trois contrôles tournent chacun même si un autre échoue : une pièce altérée est nommée même
# quand le rejeu casse.
# Les trois scripts de calcul ne passent pas au lint : ils sont publiés tels qu'exécutés le
# 25/09/2026 et leurs empreintes sont consignées ; les reformater changerait ces empreintes.
# Ce workflow ne publie rien, ne déploie rien et n'utilise aucun secret ajouté par nous : seul le
# jeton automatique de GitHub sert au checkout, en lecture seule (permissions ci-dessous), et il
# n'est pas conservé après le checkout (persist-credentials: false).
# Actions épinglées par SHA, vérifié sur GitHub le 27/09/2026 : les dernières versions tournent
# sous Node 24 (checkout v4 et setup-python v5 tournaient encore sous Node 20).
name: CI

on:
  push:
    # main ET master : le Git de la machine de publication crée « master » par défaut
    # (init.defaultBranch) ; au J0, créer le dépôt avec « git init -b main ».
    branches: [main, master]
  pull_request:
  schedule:
    # le 1er du mois, 07:00 UTC — relance mensuelle, tant que GitHub ne la suspend pas (il le
    # fait sur un dépôt public après 60 jours sans activité : la réactiver au besoin)
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Dépendances (versions figées, recoupées le 27/09/2026)
        run: python -m pip install -r requirements.txt

      - name: Les empreintes publiées sont celles des fichiers du dépôt
        if: ${{ !cancelled() }}
        run: python verifier_empreintes.py

      - name: Lint (ruff) — outils du dépôt
        if: ${{ !cancelled() }}
        run: python -m ruff check rejouer.py verifier_empreintes.py

      - name: Le calcul se rejoue à l'identique
        if: ${{ !cancelled() }}
        run: python rejouer.py
